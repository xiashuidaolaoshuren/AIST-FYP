[project]
name = "aist-fyp-colab"
version = "0.1.0"
description = "Minimal Colab environment for AIST-FYP preprocessing and evaluations"
requires-python = ">=3.11"
dependencies = [
  "pyyaml==6.0.3",
  "tqdm==4.67.1",
  "requests==2.32.5",
  "python-dotenv>=1.0.0",
  "torch==2.5.1+cu121",
  "torchvision==0.20.1+cu121",
  "torchaudio==2.5.1+cu121",
]

[project.optional-dependencies]
preprocessing = [
  "transformers==4.56.2",
  "datasets==4.1.1",
  "sentence-transformers==5.1.1",
  "faiss-cpu==1.12.0",
  "rank-bm25==0.2.2",
  "numpy==2.3.3",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "spacy==3.7.2",
  "wikiextractor==3.0.6",
  "accelerate==1.10.1",
  "pyarrow==21.0.0",
]

evaluation = [
  "numpy==2.3.3",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "openai==1.16.2",
  "configobj==5.0.9",
  "nltk==3.9.1",
]

mitigation = [
  "transformers==4.56.2",
  "sentence-transformers==5.1.1",
  "numpy==2.3.3",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "openai==1.16.2",
  "configobj==5.0.9",
  "nltk==3.9.1",
  "spacy==3.7.2",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]
torchaudio = [{ index = "pytorch-cu121" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
