# =============================================================================
# AIST-FYP Month 2 Configuration
# Baseline RAG Module Configuration for LLM Hallucination Detection
# =============================================================================

# Model Configuration
models:
  # Sentence transformer for embeddings (384D, fast on 8GB GPU)
  sentence_transformer: "sentence-transformers/all-MiniLM-L6-v2"
  
  # Generator LLM (instruction-tuned; stable for QA-style prompts)
  #generator: "Qwen/Qwen3-4B-Instruct-2507"

  # Fallback baseline (seq2seq)
  generator: "google/flan-t5-base"

  # Optional long-context candidate (not instruction-tuned for QA, may degenerate):
  # generator: "google/long-t5-tglobal-base"

# Data Paths
data:
  # Wikipedia data
  wikipedia_dump: "data/raw/enwiki-latest-pages-articles.xml.bz2"
  # Optional pinned production dump date (YYYYMMDD). Null means use 'latest'.
  wikipedia_dump_date: null
  wikipedia_sample_dev: "data/raw/wiki_sample_development.jsonl"
  wikipedia_sample_val: "data/raw/wiki_sample_validation.jsonl"
  
  # Processed chunks
  processed_chunks: "data/processed/wiki_chunks_{strategy}.jsonl"
  
  # Embeddings
  embeddings: "data/embeddings/wiki_embeddings_{strategy}.npy"
  embeddings_metadata: "data/embeddings/metadata_{strategy}.json"
  
  # FAISS index
  faiss_index: "data/indexes/{strategy}/faiss.index"
  index_metadata: "data/indexes/{strategy}/metadata.pkl"
  index_config: "data/indexes/{strategy}/index_config.json"
  bm25_index: "data/indexes/{strategy}/bm25_index.pkl"

# Data Strategy Configuration
data_strategy:
  # Development: Fast testing with small subset (10k articles)
  development:
    max_articles: 10000
    name: "development"
  
  # Validation: Medium testing (200k articles)
  validation:
    max_articles: 200000
    name: "validation"
  
  # Production: Capped Wikipedia corpus
  production:
    max_articles: null  # Set to null to process entire dump
    name: "production"
    dump_date: null  # Optional YYYYMMDD to pin snapshot (overrides data.wikipedia_dump_date)

# Processing Parameters
processing:
  # Batch size for embedding generation (16 for 8GB GPU)
  batch_size: 16
  
  # Device selection (cuda/cpu)
  device: "cuda"
  
  # Mixed precision (FP16) for faster processing
  use_fp16: true
  
  # Chunk parameters
  chunk_overlap: 0  # Number of overlapping sentences
  max_chunk_length: 512  # Maximum tokens per chunk
  min_sentence_length: 10  # Minimum characters for valid sentence

  # Query splitting for multi-question inputs
  query_split:
    # Enable splitting on question marks for multi-question processing
    enabled: false

# Retrieval Configuration
retrieval:
  # Retrieval mode: "dense" (embeddings only), "bm25" (sparse lexical only), 
  # or "hybrid" (combine both)
  mode: "hybrid"  # Options: "dense", "bm25", "hybrid"
  
  # Number of evidence chunks to retrieve
  top_k: 5
  
  # Dense Retrieval (FAISS) Configuration
  # FAISS index type: FLAT (exact), IVFFLAT (approximate), HNSW (best quality/speed)
  index_type: "IVFFLAT"
  
  # IVF parameters
  nlist: 4096  # Number of clusters for IVF
  nprobe: 128  # Number of clusters to search (accuracy vs speed)
  
  # HNSW parameters (if using HNSW)
  hnsw_m: 32  # Number of connections per element

  # FAISS runtime acceleration settings for index build/search
  faiss:
    use_gpu: false  # Set true in production to prefer CUDA FAISS when available
    gpu_id: 0  # CUDA device index for FAISS GPU operations
  
  # BM25 Sparse Retrieval Configuration
  bm25:
    k1: 1.5  # Term frequency saturation parameter (standard: 1.2-2.0)
    b: 0.75  # Length normalization parameter (standard: 0.75)
    tokenize_batch_size: 2048  # Buffered texts per tokenization flush (lower => less RAM)
    spacy_pipe_batch_size: 256  # spaCy nlp.pipe batch size (lower => less RAM)
  
  # Hybrid Retrieval Configuration
  hybrid:
    alpha: 0.7  # Weight for dense scores in linear fusion (0-1)
                # alpha=1.0: dense only, alpha=0.0: BM25 only
    fusion_method: "linear"  # Fusion method: "linear" or "rrf" (reciprocal rank fusion)
    rrf_k: 60  # RRF constant (only used if fusion_method="rrf")

  # Retrieval guardrails for low-confidence retrieval cases.
  # If top score is too low (or fewer than top_k chunks are returned),
  # retry retrieval with a larger candidate pool and keep best top_k.
  guardrails:
    enabled: true
    low_score_thresholds:
      dense: 0.20
      bm25: 2.0
      hybrid: 0.040
    fallback_top_k_multiplier: 2
    max_fallback_top_k: 20

# Generation Configuration
generation:
  # Maximum input tokens to pass into generator tokenizer
  max_input_tokens: 4096

  # Maximum new tokens to generate
  max_new_tokens: 512
  
  # Sampling parameters
  temperature: 0.2
  top_p: 0.9
  do_sample: true

  # Optional decoding controls for causal models (e.g., Qwen)
  # Helps reduce repetitive/meta-text outputs during evaluation.
  repetition_penalty: 1.05
  no_repeat_ngram_size: 3

  # Remove common self-referential trailing text ("Note:", "You are correct", etc.)
  sanitize_meta_text: true

  # Disable reasoning/thinking template mode (e.g., Qwen3 <think> blocks)
  enable_thinking: false
  
  # Generator precision mode: bf16 | fp16 | fp32 | 8bit
  torch_dtype: "bf16"

  # Optional attention backend for causal models.
  # Set to "flash_attention_2" on supported GPUs for faster decode.
  attn_implementation: null

# Verification Configuration (Month 3)
verification:
  # Enable/disable verification module (default: false for backward compatibility)
  enabled: true

  # Per-detector module toggles (used for independent verifier evaluation / ablation)
  modules:
    intrinsic: true
    grounded: true
    nli: true
    self_agreement: true
  
  # Multi-evidence verification (Month 4, Task 2)
  # If True, verify claims against ALL retrieved evidence chunks and aggregate results
  # If False, verify only against top-ranked chunk (backward compatible)
  verify_all_evidence: true
  
  # Aggregation method for multi-evidence verification
  # "max": Optimistic - take best match (max coverage, min entropy)
  # "mean": Average - mean of all scores
  aggregation_method: "max"

  # Contradiction-first fusion (Own Add-on)
  # If enabled with aggregation_method="max", multi-evidence aggregation keeps
  # the strongest contradiction signal and can select contradictory evidence as primary.
  contradiction_first_fusion: true

  # Minimum contradiction score required to prioritize contradictory evidence chunk
  contradiction_priority_threshold: 0.65

  # Extra margin over max entailment before contradiction becomes primary
  contradiction_priority_margin: 0.2

  # Minimum NLI agreement ratio across chunks to accept contradiction-first
  # primary selection when contradiction and entailment come from different chunks.
  coherence_threshold: 0.6

  # Contradiction can still become primary if it strongly dominates entailment,
  # even when cross-chunk coherence is weak.
  contradiction_dominance_factor: 1.5

  # Minimum max-entailment across all evidence chunks required before the
  # dominant-contradiction path is eligible. When peak entailment is near-zero
  # (e.g. the evidence chunk carries extra attribution clauses DeBERTa can't
  # entail), the dominance math is trivially satisfied and fires incorrectly.
  # Setting this > 0 blocks that false-positive path.
  min_entailment_for_dominance: 0.05

  # Separate ultra-low floor for the global post-assignment override.
  # This should only catch near-epsilon entailment artifacts (e.g., Blue Bell
  # attribution-clause cases) without suppressing genuine contradictions.
  global_contradiction_entailment_floor: 0.003

  # Only allow the global entailment-floor suppression when evidence grounding
  # is also strong, indicating a likely paraphrase/artifact case.
  artifact_coverage_floor: 0.50

  # If max entailment and max contradiction are both above this threshold on the
  # same evidence chunk, treat NLI as ambiguous and avoid forcing contradiction.
  nli_ambiguity_threshold: 0.85

  # Guard contradiction-first fusion when no evidence chunk provides meaningful
  # entailment context for the claim.
  min_entailment_context_threshold: 0.0

  # Option C: cross-chunk conflict guard threshold.
  # When the contradiction-peak chunk and the entailment-peak chunk are from
  # DIFFERENT evidence sources (cross-chunk), and the peak entailment across
  # all chunks >= this threshold, the evidence is considered conflicting and
  # primary_nli_mode is set to 'ambiguous' to prevent a FP contradiction verdict.
  cross_chunk_conflict_entailment_threshold: 0.42
  
  # spaCy model for NER and noun phrase extraction
  spacy_model: "en_core_web_sm"
  
  # Intrinsic Uncertainty Detector Configuration
  intrinsic:
    # Epsilon value for numerical stability in log calculations
    epsilon: 1.0e-10
    
    # Uncertainty calculation method
    method: "entropy"

    # Strict mode: raise error when logits are missing
    strict_logits: true
  
  # Retrieval-Grounded Detector Configuration
  grounded:
    # spaCy entity types to check for coverage
    # Common types: PERSON, ORG (organization), GPE (geopolitical entity),
    # DATE, NORP (nationalities/religious/political groups)
    entity_types: ["PERSON", "ORG", "GPE", "DATE", "NORP"]
    
    # Enable fuzzy matching for entity detection (case-insensitive)
    fuzzy_matching: true
    
    # Minimum token length for overlap calculation (ignore short words)
    min_token_length: 2
    
    # ROUGE method for token overlap calculation
    rouge_method: "rouge-l"
    
    # Enhanced Entity Matching Configuration (Month 2 Enhancement)
    matching:
      # Enable Tier 2: Acronym extraction and matching
      # Handles acronyms like USA, WHO, MIT, FBI with various punctuation styles
      acronym_matching: true
      
      # Enable Tier 3: Dictionary-based alias matching
      # Uses entity_aliases.py for canonical form and surface variation matching
      alias_dictionary: true

      # Enable Tier 4: LLM-based entity matching (DeepSeek API)
      llm:
        enabled: true
        provider: "deepseek"
        base_url: "https://api.deepseek.com"
        model: "deepseek-chat"
        api_key_env: "DEEPSEEK_API_KEY"
        timeout_s: 20
        max_retries: 2
        retry_backoff_s: 1.5
        max_evidence_chars: 3000
        cache_size: 2048
        temperature: 0
        max_tokens: 200
  
  # NLI (Natural Language Inference) Detector Configuration (Month 4, Task 3)
  nli:
    # Pre-trained NLI model from Hugging Face
    # DeBERTa-v3-large fine-tuned on MNLI, FEVER, ANLI, LingNLI, and WANLI datasets
    model_name: "MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli"
    
    # Device for model inference (strictly use config value)
    # Options: "cuda" (GPU), "cpu"
    device: "cuda"
    
    # Micro-batch size for batched NLI inference (auto-tuned down on OOM)
    batch_size: 32

    # Enable bidirectional NLI scoring (evidence->claim and claim->evidence).
    # This helps suppress paraphrase/coreference false positives.
    bidirectional: true
  
  # Self-Agreement Detector Configuration (Month 4, Task 4)
  self_agreement:
    # Sentence-transformer model for semantic similarity measurement
    model_name: "sentence-transformers/all-MiniLM-L6-v2"
    
    # Number of stochastic samples to generate for consistency check
    k_samples: 5

    # Max claim/query items per self-agreement generation sub-batch.
    # Lower if you encounter CUDA OOM; increase on larger GPUs.
    max_batch_size: 16
    
    # Temperature for stochastic sampling (higher = more diversity)
    temperature: 1.5
    
    # Device for model inference
    device: "cuda"
    
    # Aggregation method for multi-evidence consistency scores
    # Options: "max" (optimistic), "mean" (average), "min" (pessimistic), "inherit" (use global aggregation_method)
    aggregation_method: "inherit"
    
    # Deterministic mode for reproducible results
    # If True, uses random_seed for reproducible sampling
    # If False (default), uses stochastic sampling for robustness
    deterministic: false
    
    # Random seed for deterministic mode (only used if deterministic=true)
    # Set to any integer for reproducible results
    random_seed: 42
  
  # Sentence-level evidence retrieval for gold-context evaluation modes.
  # When enabled, each claim is verified against the top-k most semantically
  # similar sentences from the gold context rather than full passages.
  # This reduces NLI truncation and improves hallucination recall.
  # Requires a pre-built sentence index. Build with:
  #   python scripts/build_sentence_index.py --dataset ragtruth --split test
  sentence_retrieval:
    enabled: true
    # Retrieval strategy for claim-to-sentence verification:
    # - top_k: current default, retrieve the best-k sentences per claim.
    # - all_sentences: evaluator experiment mode for SummaC-style all-sentence-pairs NLI.
    mode: "top_k"
    top_k: 8
    # Optional cap used only when mode="all_sentences".
    # 0 means use all indexed sentences for the sample/context.
    all_sentences_max_k: 0
    # Exclude low-ranked dense matches from contradiction peak selection.
    min_dense_score_for_contradiction: 0.35
    # Path template for the pre-built sentence index.
    # {dataset} => "ragtruth" or "citeeval"; {split} => evaluation split (e.g., "test")
    index_dir: "data/indexes/{dataset}_sentences/{split}"

  # Citation Formatter Configuration (Month 5)
  citation:
    # Maximum number of citations to add per claim.
    # Lower values reduce over-citation and improve citation precision on CiteBench.
    max_citations_per_claim: 1

    # Minimum dense retrieval score required before attaching citations to a claim.
    # Claims with weaker evidence are left uncited to avoid forcing low-quality retrieval citations.
    min_score_dense_for_citation: 0.70

    # Minimum NLI entailment score required before attaching citations to a claim.
    # Set to 0.0 to disable the gate while keeping NLI-based evidence ranking active.
    # The gate removed high-CR citations (those with paraphrase-level NLI) in testing, so
    # ranking alone (not gating) is the effective policy.
    min_nli_entailment_for_citation: 0.0
  
  # Rule-Based Aggregator Configuration (Month 5)
  aggregator:
    # Entropy normalization parameters (from SelfCheckGPT research)
    # Entropy threshold: Value at sigmoid midpoint for uncertainty-to-confidence mapping
    entropy_threshold: 2.0
    
    # K entropy: Sigmoid steepness parameter (higher = sharper transition)
    k_entropy: 2.0
    
    # NLI thresholds for claim classification
    # Contradiction threshold: Minimum NLI contradiction score to flag as contradictory
    contradiction_threshold: 0.60

    # If entailment is very strong, suppress contradictory labels caused by
    # cross-chunk max aggregation conflicts.
    entailment_override_threshold: 0.9

    # Contradiction must be competitive with entailment by this margin.
    # Higher values make contradictory decisions more conservative.
    contradiction_entailment_margin: 0.1

    # If any evidence chunk gives moderate entailment support, require stronger
    # contradiction before assigning a contradictory label.
    cross_chunk_entailment_guard_threshold: 0.42
    cross_chunk_min_contradiction_when_supported: 0.85

    # Suppress contradiction when NLI remains highly neutral/uncertain.
    max_neutral_for_contradiction: 0.25

    # Require minimal evidence grounding before escalating to contradiction.
    min_coverage_for_contradiction: 0.15
    
    # Entailment threshold: Minimum NLI entailment score required for "Supported" status
    entailment_threshold: 0.65
    
    # Coverage threshold: Minimum coverage score required for "Supported" status
    # (used in combination with entailment)
    coverage_threshold: 0.6
    
    # Low confidence detection thresholds
    # Entropy confidence threshold: Below this indicates high uncertainty
    entropy_confidence_threshold: 0.4
    
    # Consistency confidence threshold: Below this indicates inconsistency
    consistency_confidence_threshold: 0.4
    
    # Low coverage threshold: Below this indicates poor grounding
    low_coverage_threshold: 0.3
    
    # Coverage weights for signal normalization
    # These weights determine relative importance of different coverage metrics
    coverage_weights:
      entities: 0.4      # Named entity coverage (highest weight)
      numbers: 0.3       # Numeric value coverage
      tokens_overlap: 0.3  # Lexical token overlap (ROUGE-L)

# Mitigation Strategies Configuration (Month 5)
mitigation:
  # Enable/disable mitigation module for independent evaluation
  # Set to false to evaluate base system performance without mitigation
  enabled: true
  
  # Evidence Re-Ranker Configuration
  reranker:
    # Enable/disable evidence re-ranking
    enabled: true
    
    # Weight for retrieval score (semantic similarity from FAISS)
    # Higher alpha prioritizes original retrieval quality
    alpha: 0.6
    
    # Weight for verification score (coverage + NLI entailment)
    # Higher beta prioritizes verification feedback
    beta: 0.4
    
    # Fallback verification score when signal is missing
    # Used for evidence chunks without verification signals
    # 0.5 = neutral (neither good nor bad)
    fallback_score: 0.5
  
  # Claim Filter Configuration
  filter:
    # Enable/disable claim filtering
    enabled: true
    
    # Placeholder text for removed contradictory claims
    placeholder: "[CLAIM REMOVED: Contradictory]"

    # Soft-filter threshold for Low Confidence claims (0.0 = disabled).
    # When set, LC claims with contradict_prob >= threshold are also replaced (using lc_placeholder).
    # Only activates when no Contradictory claims exist, targeting the lc_avg_contradict path.
    lc_soft_filter_prob_threshold: 0.10
    lc_placeholder: "[CLAIM UNCERTAIN: Low Confidence]"
  
  # Re-Prompting Configuration (Month 5/6)
  reprompt:
    # Enable/disable re-prompting for hallucination self-correction
    # When enabled, triggers iterative refinement if hallucination rate is high
    enabled: true
    
    # Hallucination rate threshold for triggering re-prompting
    # If (contradictory_claims / total_claims) > threshold, trigger re-prompting
    # Range: 0.0 to 1.0 (default: 0.5 = 50%)
    threshold: 0.5
    
    # Maximum number of re-prompting iterations
    # Prevents infinite loops while allowing iterative refinement
    # Recommended: 1-2 iterations (default: 2)
    max_iterations: 2
    
    # Re-prompting strategy
    # - "full": Regenerate entire answer with verification feedback
    # - "claim-specific": Create targeted verification questions (CoVe-inspired)
    # Default: "full" (simpler, works well with smaller models)
    strategy: "full"

  # Mitigation Policy Router (Own Add-on)
  # Enables objective-aware strategy gating for rerank/reprompt/filter.
  router:
    enabled: true

    # Objective profile:
    # - "ragtruth": prioritize hallucination reduction
    # - "citation": preserve citation quality and avoid over-editing
    # - "balanced": compromise between both
    objective: "balanced"

    # Trigger reranking when low-confidence ratio exceeds this threshold
    rerank_low_confidence_ratio: 0.25

    # Trigger re-prompting when contradiction ratio exceeds this threshold
    reprompt_contradiction_ratio: 0.35

    # Trigger filtering when contradiction ratio exceeds this threshold
    filter_contradiction_ratio: 0.5

    # Minimum contradictory claims required before filtering is allowed
    filter_min_contradictory_claims: 1

    # Trigger reprompt/filter based on LC signal when no contradictory claims are found.
    # Used by the lc_avg_contradict detection path in gold_context_generation mode.
    reprompt_lc_avg_contradict_prob_threshold: 0.25
    reprompt_lc_avg_contradict_ratio_threshold: 0.30

# Checkpointing
checkpointing:
  # Save checkpoint every N chunks during embedding generation
  checkpoint_frequency: 10000
  
  # Checkpoint directory
  checkpoint_dir: "data/embeddings/checkpoints/"

  # Strict checkpoint compatibility validation
  strict_compatibility: true

  # Chunk preparation checkpoint settings
  chunking:
    enabled: true
    resume_by_default: true
    checkpoint_dir: "data/checkpoints/chunking/"
    checkpoint_interval: 1000  # Save every N processed articles

  # FAISS index build checkpoint settings
  faiss:
    enabled: true
    resume_by_default: true
    checkpoint_dir: "data/checkpoints/faiss/"
    checkpoint_interval: 200000  # Save every N added vectors
    add_batch_size: 50000

  # BM25 index build checkpoint settings
  bm25:
    enabled: true
    resume_by_default: true
    checkpoint_dir: "data/checkpoints/bm25/"
    checkpoint_interval: 5000  # Save every N tokenized chunks

# Logging Configuration
logging:
  # Log file location
  log_file: "logs/month2.log"
  
  # Log level: DEBUG, INFO, WARNING, ERROR
  log_level: "INFO"
  
  # Console output level
  console_level: "ERROR"

# Evaluation (for future use)
evaluation:
  # Benchmark datasets configuration
  benchmarks:
    # RAGTruth hallucination benchmark
    ragtruth:
      dataset_path: "benchmark/RAGTruth/dataset"
      output_dir: "outputs/ragtruth_eval/"
      batch_size: 10  # Process samples in batches for memory efficiency
      ragtruth_eval_mode: "ragtruth_eval"  # ragtruth_eval | normal | gold_context_generation
      teacher_forced_intrinsic: true  # compute intrinsic uncertainty by scoring gold response
      low_confidence_ratio_threshold: 0.6  # sample-level hallucination if Low Confidence ratio >= threshold
      low_coverage_ratio_threshold: 0.28  # require stronger weak-evidence corroboration when escalating from Low Confidence
      per_task_low_coverage_ratio_threshold:
        Summary: 0.0    # gold_context_generation: gold doc is always well-covered; drop LC+coverage gate for Summary
        QA: 0.18        # relaxed from global 0.28 to recover QA LC misses
        Data2txt: 0.28  # keep original gate for Data2txt
      lc_avg_contradict_ratio_threshold: 0.30  # new trigger: minimum LC ratio for lc_avg_contradict detection path
      lc_avg_contradict_prob_threshold: 0.25   # new trigger: minimum avg contradiction prob among LC claims
      min_claims_for_lc_escalation: 3  # keep protection for 1-2 claim responses while recovering 3-claim QA misses
      data2txt_min_lc_count: 6  # Data2txt-specific fallback: escalate only when many claims are Low Confidence and contradiction evidence is absent
      data2txt_contradictory_override_enabled: false  # optional safety gate for Data2txt contradictory trigger
      data2txt_min_contradict_prob_for_contradictory: 0.5  # when override is enabled, require max contradict_prob among contradictory claims to exceed this threshold
      qa_pure_lc_block_ratio: 1.0  # QA guard: only suppress strict all-LC/no-contradiction samples
      # Summary single-contradiction guards: suppress weak single-contra triggers that fire on poor evidence.
      # Analysis showed FP claims cluster at cp<0.60 (only 1 FP at 0.45) and coverage<0.44 (2 FPs at 0.34 and 0.41).
      # Minimum TP single-contra cp=0.738 and coverage=0.465 — thresholds below these are safe.
      summary_single_contra_min_contradict_prob: 0.60  # require at least this contradict_prob when Summary fires on exactly 1 contradictory claim
      summary_single_contra_min_coverage: 0.44         # require at least this coverage_score for the sole contradictory claim
      # Optional additional guard for all_sentences mode only.
      # Helps suppress weak contradiction spikes from long-tail sentence pairs.
      all_sentences_summary_contradictory_override_enabled: false
      all_sentences_summary_min_contradict_prob_for_contradictory: 0.75
      all_sentences_summary_min_coverage_for_contradictory: 0.45
      # Minimum contradictory claims needed to flag a sample as hallucinated.
      # Per-task overrides handle task-specific DeBERTa over-firing patterns.
      min_contradictory_count_for_detection: 1  # global default
      per_task_min_contradictory:
        Data2txt: 1
        QA: 2         # recover QA misses where two strong contradictions are present
        Summary: 1    # revert to 1; min_entailment_for_dominance now guards the dominant-contradiction FP pattern
    
    # Future benchmarks
    truthful_qa:
      enabled: false
    fever:
      enabled: false
  
  # Evaluation batch size (default for all benchmarks)
  eval_batch_size: 8
